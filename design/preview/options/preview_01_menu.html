const options = () => data.map(c => `<option value="${c.id}">${label(c)}</option>`).join('');
const collapsed = new Set();
const sections = list => list.map(c => `<section class="category" id="${c.id}"><h2><button class="category-toggle" type="button" aria-expanded="${!collapsed.has(c.id)}" aria-controls="items-${c.id}">${c.title}<span aria-hidden="true">${collapsed.has(c.id) ? '+' : '&minus;'}</span></button></h2><div class="items" id="items-${c.id}" ${collapsed.has(c.id) ? 'hidden' : ''}>${c.items.map(([name,price]) => `<div class="item"><span>${name}</span><span class="price">${price}</span></div>`).join('')}</div></section>`).join('');
const searchMarkup = `<div class="search-wrap"><span class="search-icon" aria-hidden="true">&#9906;</span><input class="search" type="search" placeholder="Search menu" aria-label="Search categories and dishes"><button class="search-clear" type="button" aria-label="Clear search">Clear</button></div>`;
preview.innerHTML = `<div class="layout"><nav class="sidebar" aria-label="Menu categories"><h2>Explore the menu</h2>${searchMarkup}<div class="category-links">${data.map(c => `<a href="#${c.id}">${label(c)}</a>`).join('')}</div></nav><div class="menu-content"><div class="mobile-tools"><div class="mobile-select"><label for="mobile-category">Explore the menu</label><select id="mobile-category">${options()}</select></div>${searchMarkup}</div><div class="results-status" aria-live="polite"></div><div class="results">${sections(data)}</div></div></div>`;
const inputs = [...preview.querySelectorAll('.search')];
const decode = value => { const element = document.createElement('textarea'); element.innerHTML = value; return element.value.toLowerCase(); };
inputs.forEach(input => input.addEventListener('input', () => {
  const query = input.value.trim().toLowerCase();
  inputs.forEach(other => { if (other !== input) other.value = input.value; });
  const matches = data.map(category => {
    const categoryMatches = decode(category.title).includes(query) || decode(label(category)).includes(query);
    return {...category, items: categoryMatches ? category.items : category.items.filter(([name]) => decode(name).includes(query))};
  }).filter(category => category.items.length);
  preview.querySelector('.results').innerHTML = matches.length ? sections(matches) : '<p class="empty">No dishes or categories found. Try another search.</p>';
  const ids = new Set(matches.map(category => category.id));
  preview.querySelectorAll('.sidebar a').forEach(link => { link.hidden = !ids.has(link.hash.slice(1)); });
  preview.querySelector('#mobile-category').innerHTML = matches.map(category => `<option value="${category.id}">${label(category)}</option>`).join('');
  const count = matches.reduce((total, category) => total + category.items.length, 0);
  preview.querySelector('.results-status').textContent = query ? `${count} ${count === 1 ? 'dish' : 'dishes'} found` : '';
  updateActiveCategory();
}));
preview.querySelectorAll('.search-clear').forEach(button => button.addEventListener('click', () => {
  const input = button.parentElement.querySelector('.search');
  input.value = '';
  input.dispatchEvent(new Event('input'));
  input.focus();
}));
preview.querySelector('.results').addEventListener('click', event => {
  const button = event.target.closest('.category-toggle');
  if (!button) return;
  const id = button.closest('.category').id;
  const isExpanded = button.getAttribute('aria-expanded') === 'true';
  if (isExpanded) collapsed.add(id); else collapsed.delete(id);
  button.setAttribute('aria-expanded', String(!isExpanded));
  button.querySelector('span').textContent = isExpanded ? '+' : '\u2212';
  document.getElementById(button.getAttribute('aria-controls')).hidden = isExpanded;
});
preview.querySelector('#mobile-category').addEventListener('change', event => {
  document.getElementById(event.target.value)?.scrollIntoView({behavior:'smooth'});
});
function updateActiveCategory() {
  const visible = [...preview.querySelectorAll('.category')].filter(section => section.getBoundingClientRect().top <= 120);
  const id = visible.at(-1)?.id || preview.querySelector('.category')?.id;
  preview.querySelectorAll('.sidebar a').forEach(link => {
    const active = link.hash === `#${id}`;
    link.classList.toggle('active', active);
    if (active) link.setAttribute('aria-current', 'location');
    else link.removeAttribute('aria-current');
  });
}
window.addEventListener('scroll', updateActiveCategory, {passive:true});
updateActiveCategory();
</script></body></html>
